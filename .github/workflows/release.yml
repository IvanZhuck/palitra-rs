name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: true

          # Linux ARM64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true

          # Windows x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false

          # macOS Apple Silicon
          - os: macos-14
            target: aarch64-apple-darwin
            use_cross: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Build binary
        shell: bash
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package artifacts
        shell: bash
        id: package
        run: |
          BIN_NAME="palitra-rs"
          TAG_NAME="${{ github.event.release.tag_name }}"
          ARCHIVE_DIR="${BIN_NAME}-${TAG_NAME}-${{ matrix.target }}"
          
          mkdir -p "$ARCHIVE_DIR"

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/${BIN_NAME}.exe" "$ARCHIVE_DIR/"
            [ -f "README.md" ] && cp README.md "$ARCHIVE_DIR/"
            [ -f "LICENSE" ] && cp LICENSE "$ARCHIVE_DIR/"
            7z a "${ARCHIVE_DIR}.zip" "$ARCHIVE_DIR"
            echo "archive=${ARCHIVE_DIR}.zip" >> $GITHUB_OUTPUT
          else
            cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$ARCHIVE_DIR/"
            [ -f "README.md" ] && cp README.md "$ARCHIVE_DIR/"
            [ -f "LICENSE" ] && cp LICENSE "$ARCHIVE_DIR/"
            tar -czvf "${ARCHIVE_DIR}.tar.gz" "$ARCHIVE_DIR"
            echo "archive=${ARCHIVE_DIR}.tar.gz" >> $GITHUB_OUTPUT
          fi

      - name: Upload binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.archive }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}