[package]
name = "palitra-rs"
license = "MIT"
version = "1.0.0"
edition = "2024"

[profile.release]
strip = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
comfy-table = "8.0.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "avif", "bmp", "tiff", "ico"]}
